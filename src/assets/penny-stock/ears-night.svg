<svg data-thick="2.6" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<title>Penny Stock — rolling pony (v20, right profile)</title>
<desc>Right-profile view, facing right like every mount: only the two right legs show, the pony is rigid on caster wheels. Palomino coat, cream-white mane, tail and feathering, worn leather saddle with a tattered plum blanket, breast strap, bridle and reins, and a hanging stirrup. The mane (#mane) and tail (#tail) are separate groups with pivots so they can sway when the mount jumps.</desc>
<defs>
  <linearGradient id="coat" gradientUnits="userSpaceOnUse" x1="0" y1="190" x2="0" y2="800"><stop offset="0" stop-color="#f8d466"/><stop offset=".5" stop-color="#e2a831"/><stop offset="1" stop-color="#b07514"/></linearGradient>
  <linearGradient id="muzzle" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="#fbe5a2"/><stop offset="1" stop-color="#d69e3c"/></linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset=".55" stop-color="#f1e3c3"/><stop offset="1" stop-color="#d8bf8d"/></linearGradient>
  <linearGradient id="cloth" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#c22d2f"/><stop offset="1" stop-color="#701216"/></linearGradient>
  <linearGradient id="leather" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="#7a6253"/><stop offset="1" stop-color="#4a3a31"/></linearGradient>
  <linearGradient id="strap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f3a2e"/><stop offset="1" stop-color="#2f231c"/></linearGradient>
  <radialGradient id="brass" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#e9d9b2"/><stop offset="1" stop-color="#8a7656"/></radialGradient>
  <radialGradient id="muzzleGlow" gradientUnits="userSpaceOnUse" cx="902" cy="330" r="38"><stop offset="0" stop-color="#fde9ad" stop-opacity=".95"/><stop offset=".6" stop-color="#f6d58a" stop-opacity=".55"/><stop offset="1" stop-color="#f0c56a" stop-opacity="0"/></radialGradient>
  <clipPath id="headClip"><path d="M722 228C744 210 774 204 798 206C832 226 868 266 914 302C924 312 930 330 926 346C922 356 914 360 904 360C900 366 892 370 882 368C866 366 850 360 832 360C806 362 778 368 756 356C740 346 734 326 728 306C718 284 710 250 722 228Z"/></clipPath>
  <filter id="coatFx" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="3" seed="11" result="grain"/>
    <feColorMatrix in="grain" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".1"/></feComponentTransfer>
    <feComposite in2="SourceGraphic" operator="in" result="texture"/>
    <feBlend in="SourceGraphic" in2="texture" mode="soft-light"/>
  </filter>
</defs>
<g stroke="#f3e3c3" stroke-linejoin="round" stroke-linecap="round">
  <!-- Right profile: the far ear hides behind the near one; the mane ends over the poll -->
  <path d="M760 240C749 231 736 232 724 239C714 246 709 257 712 270L742 266Z" fill="url(#hair)" stroke="none"/>
  <path d="M760 240C749 231 736 232 724 239C714 246 709 257 712 270" fill="none" stroke-width="13"/>
  <path d="M717 260Q720 248 733 244M730 260Q735 249 746 246" fill="none" stroke="#cdb382" stroke-width="6.5"/>
  <path d="M742 236C736 210 742 182 760 158C772 178 778 206 774 234C778 244 782 252 786 258L752 262C746 254 744 246 742 236Z" fill="url(#coat)" stroke="none"/>
  <path d="M761 166C768 182 772 206 769 230C764 210 761 188 761 166Z" fill="#9a5c18" stroke="none"/>
  <path d="M742 236C736 210 742 182 760 158C772 178 778 206 774 234" fill="none" stroke-width="13"/>
</g>
</svg>

